---
on:
  push:
    tags:
      - "*"

jobs:
  "publish":
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"

    runs-on: "${{ matrix.os }}"

    permissions:
      contents: "write"

    steps:
      - uses: "actions/checkout@v7"

      - uses: "actions/setup-java@v5"
        with:
          distribution: "temurin"
          java-version: "21"
          settings-path: "${{ github.workspace }}"

      - uses: "gradle/actions/setup-gradle@v6"

      - run: "./gradlew build"

      - uses: "softprops/action-gh-release@v1"
        with:
          files: |
            ./build/jpackage/*.deb
            ./build/jpackage/*.rpm
            ./build/jpackage/*.pkg
            ./build/jpackage/*.dmg
            ./build/jpackage/*.exe
            ./build/jpackage/*.msi
